<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Location - Class of 2015 Reunion</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Raleway:wght@400;700&family=Poiret+One&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Raleway', sans-serif;
      background: #000000;
      color: #FFD700;
      margin: 0;
      padding: 0;
      text-align: center;
      height: 100vh;
      position: relative;
      overflow-x: hidden;
    }
    .background-slideshow {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      background-size: cover;
      background-position: center;
      opacity: 0;
      transition: opacity 2s ease-in-out;
    }
    .background-slideshow.active {
      opacity: 1;
    }
    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      z-index: 0;
    }
    .nav {
      position: fixed;
      top: 0;
      width: 100%;
      background: rgba(0, 0, 0, 0.9);
      padding: 15px 0;
      z-index: 100;
      border-bottom: 2px solid #FFD700;
    }
    .nav a {
      font-family: 'Poiret One', cursive;
      color: #FFD700;
      text-decoration: none;
      margin: 0 25px;
      font-size: 18px;
      font-weight: 400;
      text-transform: uppercase;
      letter-spacing: 2px;
      transition: color 0.3s;
    }
    .nav a:hover {
      color: #E5E5E5;
    }
    .content {
      position: relative;
      z-index: 1;
      padding: 100px 20px 150px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    h1 {
      font-family: 'Cinzel', serif;
      color: #FFD700;
      font-size: 3em;
      text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.5);
      margin: 0 0 40px;
      letter-spacing: 2px;
      border-bottom: 2px solid #FFD700;
      padding-bottom: 10px;
    }
    .location-info {
      max-width: 800px;
      margin: 0 auto 40px;
      text-align: center;
      background: rgba(0, 0, 0, 0.8);
      padding: 30px;
      border-radius: 8px;
      border: 4px solid #FFD700;
    }
    .location-info h2 {
      font-family: 'Cinzel', serif;
      font-size: 2em;
      color: #FFD700;
      margin: 0 0 20px;
      letter-spacing: 1px;
    }
    .location-info p {
      font-size: 1.5em;
      color: #E5E5E5;
      margin: 10px 0;
      line-height: 1.8;
      font-weight: 500;
    }
    .location-info a {
      color: #FFFFFF; /* White hyperlink */
      text-decoration: underline;
    }
    .location-info a:hover {
      color: #E5E5E5; /* Soft white on hover */
    }
    .slider {
      max-width: 800px;
      width: 100%;
      position: relative;
      overflow: hidden;
      border: 2px solid #FFD700;
      border-radius: 8px;
    }
    .slider img {
      width: 100%;
      height: 450px;
      object-fit: contain;
      background: #000;
      display: none;
    }
    .slider img.active {
      display: block;
    }
    .slider-buttons {
      position: absolute;
      top: 0;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 10px;
    }
    .slider-buttons button {
      background: rgba(255, 215, 0, 0.7);
      color: #000000;
      border: none;
      padding: 10px 15px;
      font-size: 16px;
      font-weight: 600;
      text-transform: uppercase;
      cursor: pointer;
      border-radius: 5px;
      opacity: 0.8;
      transition: all 0.3s;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .slider-buttons button:hover {
      opacity: 1;
      background: #E5E5E5;
    }
    .slider-buttons button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .slider-buttons #prev-btn {
      position: absolute;
      left: 10px;
    }
    .slider-buttons #next-btn {
      position: absolute;
      right: 10px;
    }
    /* Footer Styles */
    footer {
      position: fixed;
      bottom: 0;
      width: 100%;
      background: rgba(0, 0, 0, 0);
      padding: 10px 40px 10px 0;
      z-index: 90;
      text-align: right;
    }
    .facebook-link {
      display: inline-block;
    }
    .facebook-link img {
      width: 30px;
      height: 30px;
      opacity: 0.8;
      transition: opacity 0.3s;
    }
    .facebook-link img:hover {
      opacity: 1;
    }
    @media (max-width: 700px) {
      h1 {
        font-size: 2em;
      }
      .location-info {
        padding: 20px;
      }
      .location-info h2 {
        font-size: 1.5em;
      }
      .location-info p {
        font-size: 1.2em;
      }
      .slider {
        max-width: 90%;
      }
      .slider img {
        height: 300px;
      }
      .slider-buttons button {
        padding: 8px 12px;
        font-size: 14px;
        width: 35px;
        height: 35px;
      }
      footer {
        padding: 8px 30px 8px 0;
      }
      .facebook-link img {
        width: 25px;
        height: 25px;
      }
      .nav a {
        font-size: 14px;
        margin: 0 15px;
      }
    }
  </style>
</head>

  <script>
    // Background Slideshow
    const backgrounds = [
      "https://github.com/divelbissg/2015class-reunion/blob/main/images/IMG_4220.jpg?raw=true",
      "https://github.com/divelbissg/2015class-reunion/blob/main/images/IMG_4221.jpg?raw=true",
      "https://github.com/divelbissg/2015class-reunion/blob/main/images/IMG_4222.jpg?raw=true",
      "https://github.com/divelbissg/2015class-reunion/blob/main/images/IMG_4223.jpg?raw=true",
      "https://github.com/divelbissg/2015class-reunion/blob/main/images/IMG_4224.jpg?raw=true",
      "https://github.com/divelbissg/2015class-reunion/blob/main/images/IMG_4225.jpg?raw=true",
      "https://github.com/divelbissg/2015class-reunion/blob/main/images/IMG_4226.jpg?raw=true",
      "https://github.com/divelbissg/2015class-reunion/blob/main/images/IMG_4227.jpg?raw=true",
      "https://github.com/divelbissg/2015class-reunion/blob/main/images/IMG_4228.jpg?raw=true",
      "https://github.com/divelbissg/2015class-reunion/blob/main/images/IMG_4229.jpg?raw=true",
      "https://github.com/divelbissg/2015class-reunion/blob/main/images/IMG_4230.jpg?raw=true",
      "https://github.com/divelbissg/2015class-reunion/blob/main/images/IMG_4231.jpg?raw=true",
      "https://github.com/divelbissg/2015class-reunion/blob/main/images/IMG_4232.jpg?raw=true",
      "https://github.com/divelbissg/2015class-reunion/blob/main/images/IMG_4233.jpg?raw=true",
      "https://github.com/divelbissg/2015class-reunion/blob/main/images/IMG_4234.jpg?raw=true",
      "https://github.com/divelbissg/2015class-reunion/blob/main/images/IMG_4235.jpg?raw=true",
      "https://github.com/divelbissg/2015class-reunion/blob/main/images/IMG_4236.jpg?raw=true",
      "https://github.com/divelbissg/2015class-reunion/blob/main/images/IMG_4237.jpg?raw=true",
      "https://github.com/divelbissg/2015class-reunion/blob/main/images/IMG_4238.jpg?raw=true",
      "https://github.com/divelbissg/2015class-reunion/blob/main/images/IMG_4239.jpg?raw=true",
      "https://github.com/divelbissg/2015class-reunion/blob/main/images/IMG_4240.jpg?raw=true"
    ];

    // Fisher-Yates shuffle to randomize array
    function shuffleArray(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
      return array;
    }

    // Shuffle backgrounds initially
    let shuffledBackgrounds = [...backgrounds];
    shuffleArray(shuffledBackgrounds);

    let currentBgIndex = 0;
    let usedIndices = [];

    function changeBackground() {
      const bgElements = document.querySelectorAll(".background-slideshow");
      bgElements.forEach(bg => bg.classList.remove("active"));

      if (usedIndices.length >= shuffledBackgrounds.length) {
        usedIndices = [];
        shuffleArray(shuffledBackgrounds);
      }

      let nextIndex;
      do {
        nextIndex = Math.floor(Math.random() * shuffledBackgrounds.length);
      } while (usedIndices.includes(nextIndex));

      usedIndices.push(nextIndex);

      const currentBg = bgElements[currentBgIndex];
      currentBg.style.backgroundImage = `url(${shuffledBackgrounds[nextIndex]})`;
      currentBg.classList.add("active");

      currentBgIndex = (currentBgIndex + 1) % bgElements.length;
    }

    changeBackground();
    setInterval(changeBackground, 10000);

    // Slider Functionality
    const slides = document.querySelectorAll('.slider img');
    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');
    let currentSlide = 0;

    function showSlide(index) {
      slides.forEach((slide, i) => {
        slide.classList.remove('active');
        if (i === index) slide.classList.add('active');
      });
      prevBtn.disabled = index === 0;
      nextBtn.disabled = index === slides.length - 1;
    }

    prevBtn.addEventListener('click', () => {
      if (currentSlide > 0) {
        currentSlide--;
        showSlide(currentSlide);
      }
    });

    nextBtn.addEventListener('click', () => {
      if (currentSlide < slides.length - 1) {
        currentSlide++;
        showSlide(currentSlide);
      }
    });

    // Initialize with the first slide active
    showSlide(currentSlide);
  </script>
</body>
