<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Gallery - Class of 2015 Reunion</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Raleway:wght@400;700&family=Poiret+One&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Raleway', sans-serif;
      background: #000000;
      color: #FFD700;
      margin: 0;
      padding: 0;
      text-align: center;
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
    }
    .background-slideshow {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      background-size: cover;
      background-position: center;
      opacity: 0;
      transition: opacity 2s ease-in-out;
    }
    .background-slideshow.active {
      opacity: 1;
    }
    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      z-index: 0;
    }
    .nav {
      position: fixed;
      top: 0;
      width: 100%;
      background: rgba(0, 0, 0, 0.9);
      padding: 15px 0;
      z-index: 100;
      border-bottom: 2px solid #FFD700;
    }
    .nav a {
      font-family: 'Poiret One', cursive;
      color: #FFD700;
      text-decoration: none;
      margin: 0 25px;
      font-size: 18px;
      font-weight: 400;
      text-transform: uppercase;
      letter-spacing: 2px;
      transition: color 0.3s;
    }
    .nav a:hover {
      color: #E5E5E5;
    }
    .content {
      position: relative;
      z-index: 1;
      padding: 100px 20px 180px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: hidden;
    }
    h1 {
      font-family: 'Cinzel', serif;
      color: #FFD700;
      font-size: 3em;
      text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.5);
      margin: 0 0 40px;
      letter-spacing: 2px;
      border-bottom: 2px solid #FFD700;
      padding-bottom: 10px;
      width: 100%;
      max-width: 1200px;
    }
    .main-preview {
      width: 100%;
      max-width: 800px;
      margin: 0 auto 20px;
      cursor: pointer;
    }
    .main-preview img {
      width: 100%;
      height: 450px;
      object-fit: contain;
      background: #000;
      border: 0.5px solid #FFD700;
      border-radius: 8px;
      display: block;
    }
    .gallery-container {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      margin: 0;
      overflow-x: auto;
      overflow-y: hidden;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: thin;
      scrollbar-color: #FFD700 #000000;
      z-index: 10;
      background: rgba(0, 0, 0, 0.8);
      border-top: 2px solid #FFD700;
    }
    .gallery-container::-webkit-scrollbar {
      height: 8px;
    }
    .gallery-container::-webkit-scrollbar-track {
      background: #000000;
    }
    .gallery-container::-webkit-scrollbar-thumb {
      background: #FFD700;
      border-radius: 4px;
    }
    .gallery {
      display: flex;
      white-space: nowrap;
      padding: 10px;
      width: 100%;
    }
    .gallery img {
      width: 200px;
      height: 150px;
      object-fit: contain;
      background: #000;
      margin: 0 10px;
      border: 2px solid #FFD700;
      border-radius: 5px;
      display: inline-block;
      cursor: pointer;
      transition: transform 0.3s, opacity 0.3s;
      flex: 0 0 auto;
      opacity: 0.7;
    }
    .gallery img:hover, .gallery img.active {
      transform: scale(1.05);
      opacity: 1;
      box-shadow: 0 0 10px #FFD700;
    }
    .disclaimer {
      margin-top: 40px;
      font-size: 16px;
      color: #FFD700;
      max-width: 1200px;
      text-align: left;
      line-height: 1.5;
      opacity: 0.6;
    }
    .disclaimer a {
      color: #FFD700;
      text-decoration: underline;
    }
    .disclaimer a:hover {
      color: #E5E5E5;
    }
    /* Footer Styles */
    footer {
      position: fixed;
      bottom: 0;
      width: 100%;
      background: rgba(0, 0, 0, 0);
      padding: 10px 40px 10px 0; /* Increased padding-right for more offset */
      z-index: 90;
      text-align: right;
    }
    .facebook-link {
      display: inline-block;
    }
    .facebook-link img {
      width: 30px;
      height: 30px;
      opacity: 0.8;
      transition: opacity 0.3s;
    }
    .facebook-link img:hover {
      opacity: 1;
    }
    /* Lightbox Styles */
    .lightbox {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.9);
      z-index: 200;
      align-items: center;
      justify-content: center;
    }
    .lightbox.active {
      display: flex;
    }
    .lightbox img {
      max-width: 90%;
      max-height: 80%;
      border: 2px solid #FFD700;
      border-radius: 8px;
      object-fit: contain;
      background: #000;
    }
    .lightbox-nav {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      font-size: 40px;
      color: #FFD700;
      cursor: pointer;
      user-select: none;
    }
    .lightbox-nav.prev {
      left: 20px;
    }
    .lightbox-nav.next {
      right: 20px;
    }
    .lightbox-close {
      position: absolute;
      top: 10px;
      right: 10px;
      font-size: 36px;
      color: #FFFFFF;
      background: rgba(0, 0, 0, 0.8);
      border: 2px solid #FFD700;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      user-select: none;
      z-index: 201;
      transition: background 0.3s, color 0.3s;
    }
    .lightbox-close:hover {
      background: #FFD700;
      color: #000000;
    }
    @media (max-width: 700px) {
      h1 {
        font-size: 2em;
      }
      .main-preview {
        width: 90%;
      }
      .main-preview img {
        height: 300px;
      }
      .gallery-container {
        width: 100%;
      }
      .gallery img {
        width: 120px;
        height: 90px;
      }
      .disclaimer {
        font-size: 12px;
        padding: 0 10px;
      }
      .nav a {
        font-size: 14px;
        margin: 0 15px;
      }
      .lightbox img {
        max-width: 95%;
        max-height: 70%;
      }
      .lightbox-nav {
        font-size: 30px;
      }
      .lightbox-nav.prev {
        left: 10px;
      }
      .lightbox-nav.next {
        right: 10px;
      }
      .lightbox-close {
        font-size: 30px;
        width: 36px;
        height: 36px;
        top: 5px;
        right: 5px;
      }
      footer {
        padding: 8px 0;
      }
      .facebook-link img {
        width: 25px;
        height: 25px;
      }
    }
  </style>

  <script>
    // Background Slideshow
    const backgrounds = [
      "https://github.com/divelbissg/2015class-reunion/raw/main/images/IMG_4220.jpg",
      "https://github.com/divelbissg/2015class-reunion/raw/main/images/IMG_4221.jpg",

      "https://github.com/divelbissg/2015class-reunion/raw/main/images/IMG_4225.jpg",
      "https://github.com/divelbissg/2015class-reunion/raw/main/images/IMG_4226.jpg",
      "https://github.com/divelbissg/2015class-reunion/raw/main/images/IMG_4227.jpg",
      "https://github.com/divelbissg/2015class-reunion/raw/main/images/IMG_4228.jpg",
      "https://github.com/divelbissg/2015class-reunion/raw/main/images/IMG_4229.jpg",
      "https://github.com/divelbissg/2015class-reunion/raw/main/images/IMG_4230.jpg",
      "https://github.com/divelbissg/2015class-reunion/raw/main/images/IMG_4231.jpg",
      "https://github.com/divelbissg/2015class-reunion/raw/main/images/IMG_4232.jpg",
      "https://github.com/divelbissg/2015class-reunion/raw/main/images/IMG_4233.jpg",
      "https://github.com/divelbissg/2015class-reunion/raw/main/images/IMG_4234.jpg",
      "https://github.com/divelbissg/2015class-reunion/raw/main/images/IMG_4235.jpg",
      "https://github.com/divelbissg/2015class-reunion/raw/main/images/IMG_4236.jpg",
      "https://github.com/divelbissg/2015class-reunion/raw/main/images/IMG_4237.jpg",
      "https://github.com/divelbissg/2015class-reunion/raw/main/images/IMG_4238.jpg",
      "https://github.com/divelbissg/2015class-reunion/raw/main/images/IMG_4239.jpg",
      "https://github.com/divelbissg/2015class-reunion/raw/main/images/IMG_4240.jpg"
    ];

    // Fisher-Yates shuffle
    function shuffleArray(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
      return array;
    }

    let shuffledBackgrounds = [...backgrounds];
    shuffleArray(shuffledBackgrounds);
    let currentBgIndex = 0;
    let usedIndices = [];

    function changeBackground() {
      const bgElements = document.querySelectorAll(".background-slideshow");
      bgElements.forEach(bg => bg.classList.remove("active"));

      if (usedIndices.length >= shuffledBackgrounds.length) {
        usedIndices = [];
        shuffleArray(shuffledBackgrounds);
      }

      let nextIndex;
      do {
        nextIndex = Math.floor(Math.random() * shuffledBackgrounds.length);
      } while (usedIndices.includes(nextIndex));

      usedIndices.push(nextIndex);

      const currentBg = bgElements[currentBgIndex];
      currentBg.style.backgroundImage = `url(${shuffledBackgrounds[nextIndex]})`;
      currentBg.classList.add("active");

      currentBgIndex = (currentBgIndex + 1) % bgElements.length;
    }

    changeBackground();
    setInterval(changeBackground, 10000);

    // Photo Slider and Lightbox Functionality
    const mainImage = document.getElementById('main-image');
    const galleryImages = document.querySelectorAll('.gallery img');
    const lightbox = document.getElementById('lightbox');
    const lightboxImage = document.getElementById('lightbox-image');
    const lightboxClose = document.getElementById('lightbox-close');
    const lightboxPrev = document.getElementById('lightbox-prev');
    const lightboxNext = document.getElementById('lightbox-next');
    let currentImageIndex = 0;

    function updateMainImage(index) {
      galleryImages.forEach(img => img.classList.remove('active'));
      galleryImages[index].classList.add('active');
      mainImage.src = galleryImages[index].src;
      mainImage.alt = galleryImages[index].alt;
      currentImageIndex = index;

      // Scroll to center the active thumbnail
      const activeImg = galleryImages[index];
      const galleryContainer = document.querySelector('.gallery-container');
      const imgOffset = activeImg.offsetLeft + (activeImg.offsetWidth / 2) - (galleryContainer.offsetWidth / 2);
      galleryContainer.scrollTo({ left: imgOffset, behavior: 'smooth' });
    }

    function openLightbox(index) {
      currentImageIndex = index;
      lightboxImage.src = galleryImages[index].src;
      lightboxImage.alt = galleryImages[index].alt;
      lightbox.classList.add('active');
    }

    function closeLightbox() {
      lightbox.classList.remove('active');
    }

    function showPrevImage() {
      currentImageIndex = (currentImageIndex - 1 + galleryImages.length) % galleryImages.length;
      lightboxImage.src = galleryImages[currentImageIndex].src;
      lightboxImage.alt = galleryImages[currentImageIndex].alt;
      updateMainImage(currentImageIndex);
    }

    function showNextImage() {
      currentImageIndex = (currentImageIndex + 1) % galleryImages.length;
      lightboxImage.src = galleryImages[currentImageIndex].src;
      lightboxImage.alt = galleryImages[currentImageIndex].alt;
      updateMainImage(currentImageIndex);
    }

    // Gallery thumbnail click
    galleryImages.forEach((img, index) => {
      img.addEventListener('click', () => {
        updateMainImage(index);
      });
    });

    // Main image click to open lightbox
    mainImage.addEventListener('click', () => {
      openLightbox(currentImageIndex);
    });

    // Lightbox navigation
    lightboxClose.addEventListener('click', closeLightbox);
    lightboxPrev.addEventListener('click', showPrevImage);
    lightboxNext.addEventListener('click', showNextImage);

    // Click anywhere on lightbox background to close
    lightbox.addEventListener('click', (e) => {
      if (e.target === lightbox) {
        closeLightbox();
      }
    });

    // Keyboard navigation
    document.addEventListener('keydown', (e) => {
      if (lightbox.classList.contains('active')) {
        if (e.key === 'ArrowLeft') showPrevImage();
        if (e.key === 'ArrowRight') showNextImage();
        if (e.key === 'Escape') closeLightbox();
      }
    });

    // Initialize first image
    updateMainImage(0);
  </script>
</body>
</html>
