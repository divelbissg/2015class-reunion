<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Apache Junction High School Class of 2015 - 10 Year Reunion</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Raleway:wght@400;700&family=Poiret+One&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Raleway', sans-serif;
      background: #000000;
      color: #FFD700;
      margin: 0;
      padding: 0;
      text-align: center;
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
    }
    .background-slideshow {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      background-size: cover;
      background-position: center;
      opacity: 0;
      transition: opacity 2s ease-in-out;
    }
    .background-slideshow.active {
      opacity: 0.7;
    }
    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.6);
      z-index: 0;
    }
    .nav {
      position: fixed;
      top: 0;
      width: 100%;
      background: rgba(0, 0, 0, 0.9);
      padding: 10px 0;
      z-index: 100;
      border-bottom: 2px solid #FFD700;
    }
    .nav-menu {
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .nav a {
      font-family: 'Poiret One', cursive;
      color: #FFD700;
      text-decoration: none;
      font-size: 16px;
      font-weight: 400;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: color 0.3s;
      padding: 10px;
    }
    .nav a:hover {
      color: #E5E5E5;
    }
    .hamburger {
      display: none;
      font-size: 24px;
      color: #FFD700;
      cursor: pointer;
      padding: 10px;
    }
    .content {
      position: relative;
      z-index: 1;
      padding: 80px 15px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    h1 {
      font-family: 'Cinzel', serif;
      color: #FFD700;
      margin: 0 0 20px;
      letter-spacing: 1px;
      text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.5);
      border-bottom: 2px solid #FFD700;
      padding-bottom: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    h1 span:first-child {
      font-size: 2.2em;
      line-height: 1.2;
    }
    h1 span:last-child {
      font-size: 1.6em;
      line-height: 1.2;
    }
    .countdown {
      font-size: 1.4em;
      margin: 20px 0;
      color: #E5E5E5;
      font-weight: 500;
      letter-spacing: 1px;
    }
    .rsvp-button {
      background-color: #FFD700;
      color: #000000;
      padding: 10px 20px;
      text-decoration: none;
      border-radius: 5px;
      font-size: 14px;
      font-weight: 600;
      text-transform: uppercase;
      display: inline-block;
      margin: 10px;
      transition: all 0.3s;
      border: 2px solid #FFD700;
    }
    .rsvp-button:hover {
      background-color: #E5E5E5;
      color: #000000;
      box-shadow: 0 0 10px #FFD700;
    }
    @media (max-width: 700px) {
      h1 span:first-child {
        font-size: 1.8em;
      }
      h1 span:last-child {
        font-size: 1.2em;
      }
      .countdown {
        font-size: 1.1em;
      }
      .rsvp-button {
        padding: 8px 15px;
        font-size: 12px;
      }
      .hamburger {
        display: block;
      }
      .nav-menu {
        display: none;
        flex-direction: column;
        background: rgba(0, 0, 0, 0.95);
        position: absolute;
        top: 50px;
        left: 0;
        width: 100%;
      }
      .nav-menu.active {
        display: flex;
      }
      .nav a {
        font-size: 14px;
        margin: 5px 0;
      }
      .content {
        padding: 70px 10px;
      }
    }
  </style>
</head>
<body>
  <div class="background-slideshow" id="bg1"></div>
  <div class="background-slideshow" id="bg2"></div>
  <div class="background-slideshow" id="bg3"></div>
  <div class="background-slideshow" id="bg4"></div>
  <div class="background-slideshow" id="bg5"></div>
  <div class="overlay"></div>

  <div class="nav">
    <div class="hamburger" onclick="toggleMenu()">&#9776;</div>
    <div class="nav-menu" id="navMenu">
      <a href="details.html" title="Event date, time, dress code, and more">Details</a>
      <a href="location.html" title="Location details (TBD)">Location</a>
      <a href="gallery.html" title="View photos from our high school days">Gallery</a>
      <a href="faq.html" title="Frequently asked questions about the reunion">FAQ</a>
      <a href="https://forms.gle/vHFTYvjDLDFTGJRA8" target="_blank" title="Register for the reunion here">RSVP</a>
    </div>
  </div>

  <div class="content">
    <h1>
      <span>Apache Junction High School</span>
      <span>Class of 2015 - 10 Year Reunion</span>
    </h1>
    <div class="countdown" id="countdown"></div>
    <a class="rsvp-button" href="https://forms.gle/vHFTYvjDLDFTGJRA8" target="_blank">RSVP Now</a>
  </div>

  <script>
    // Background Slideshow
    const backgrounds = [
      "https://github.com/divelbissg/2015class-reunion/blob/main/images/IMG_4220.jpg?raw=true",
      "https://github.com/divelbissg/2015class-reunion/blob/main/images/IMG_4221.jpg?raw=true",
      "https://github.com/divelbissg/2015class-reunion/blob/main/images/IMG_4222.jpg?raw=true",
      "https://github.com/divelbissg/2015class-reunion/blob/main/images/IMG_4223.jpg?raw=true",
      "https://github.com/divelbissg/2015class-reunion/blob/main/images/IMG_4224.jpg?raw=true"
    ];

    // Fisher-Yates shuffle
    function shuffleArray(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
      return array;
    }

    let shuffledBackgrounds = [...backgrounds];
    shuffleArray(shuffledBackgrounds);
    let currentBgIndex = 0;
    let usedIndices = [];

    function changeBackground() {
      const bgElements = document.querySelectorAll(".background-slideshow");
      bgElements.forEach(bg => bg.classList.remove("active"));

      if (usedIndices.length >= shuffledBackgrounds.length) {
        usedIndices = [];
        shuffleArray(shuffledBackgrounds);
      }

      let nextIndex;
      do {
        nextIndex = Math.floor(Math.random() * shuffledBackgrounds.length);
      } while (usedIndices.includes(nextIndex));

      usedIndices.push(nextIndex);

      const currentBg = bgElements[currentBgIndex];
      currentBg.style.backgroundImage = `url(${shuffledBackgrounds[nextIndex]})`;
      currentBg.classList.add("active");

      currentBgIndex = (currentBgIndex + 1) % bgElements.length;
    }

    changeBackground();
    setInterval(changeBackground, 10000);

    // Hamburger Menu Toggle
    function toggleMenu() {
      const navMenu = document.getElementById("navMenu");
      navMenu.classList.toggle("active");
    }
  </script>
</body>
</html>
